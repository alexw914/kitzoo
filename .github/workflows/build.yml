name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build and test all targets
        shell: pwsh
        run: |
          # runner-images installs the x64 development package here.
          $opensslRoot = Join-Path $env:ProgramFiles 'OpenSSL'
          if (!(Test-Path (Join-Path $opensslRoot 'include/openssl/ssl.h')) -or
              !(Test-Path (Join-Path $opensslRoot 'bin/openssl.exe'))) {
            throw "OpenSSL development installation not found at $opensslRoot"
          }
          ./scripts/windows_build_test.ps1 -Configuration Release -OpenSSLRoot $opensslRoot

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build libssl-dev
      - name: Build and test all targets
        run: ./scripts/linux_build_test.sh release

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install ninja openssl@3
      - name: Build and test all targets
        run: ./scripts/macos_build_test.sh release

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev gcovr
      - name: Build and test with coverage
        # Debug keeps line mapping exact; optimized builds merge and drop lines.
        run: |
          cmake -S . -B build-coverage -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DKITZOO_ENABLE_COVERAGE=ON -DKITZOO_BUILD_TESTS=ON \
            -DKITZOO_BUILD_EXAMPLES=OFF -DKITZOO_WITH_OPENSSL=ON
          cmake --build build-coverage
          ctest --test-dir build-coverage --output-on-failure --timeout 300
      - name: Coverage report
        run: |
          mkdir -p coverage
          gcovr --root . --filter include/ --filter src/ --exclude-throw-branches \
            --print-summary --txt coverage/summary.txt --html-details coverage/index.html build-coverage
          { echo '```'; cat coverage/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
