name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build libssl-dev
      - name: Configure all modules
        run: cmake --preset debug -DKITZOO_WITH_OPENSSL=ON -DKITZOO_WITH_MIMALLOC=ON
      - name: Build library, tests, benchmarks, and examples
        run: cmake --build --preset debug
      - name: Run tests and benchmark smoke tests
        run: ctest --preset debug
