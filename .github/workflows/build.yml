name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build libssl-dev
      - name: Build and test all targets
        run: ./scripts/linux_build_test.sh debug

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install ninja openssl@3
      - name: Build and test all targets
        run: ./scripts/macos_build_test.sh
